# PixEz web — static Flutter bundle + same-origin Pixiv reverse proxy.
#
# The browser cannot call Pixiv directly:
#   * app-api.pixiv.net / oauth.secure.pixiv.net send no CORS headers;
#   * i.pximg.net requires a pixiv Referer and no browser may set it;
#   * the browser forbids setting the `Host` header.
# Every request is therefore proxied through this server, which rewrites
# `Host` / `Referer` for us.  The Flutter app uses the `/pixiv-*` prefixes
# defined in `lib/net/endpoints_web.dart`.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    # HTTP Basic Auth, generated by deploy/docker-auth.sh at container start.
    # The file only contains a comment when PIXEZ_AUTH_PASSWORD is empty.
    include /etc/nginx/pixez-auth.conf;

    # Large enough for SauceNAO image uploads and PixEz data imports.
    client_max_body_size 64m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/octet-stream
        image/svg+xml;

    # ---------------------------------------------------------------------
    # Health check (used by docker-compose)
    # ---------------------------------------------------------------------
    location = /healthz {
        auth_basic off;
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------------
    # Flutter web assets
    # ---------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # Chrome fetches these without credentials, so keep them public to avoid
    # a Basic Auth prompt loop for the PWA manifest / favicon.
    location = /manifest.json {
        auth_basic off;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /favicon.png {
        auth_basic off;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /main.dart.js {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ^~ /canvaskit/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ^~ /icons/ {
        auth_basic off;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /sqlite3.wasm {
        types { application/wasm wasm; }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /sqflite_sw.js {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------
    # Pixiv APP API
    # ---------------------------------------------------------------------
    location ^~ /pixiv-api/ {
        proxy_pass https://app-api.pixiv.net/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name app-api.pixiv.net;
        proxy_set_header Host app-api.pixiv.net;
        proxy_set_header User-Agent "PixivAndroidApp/5.0.166 (Android 10.0; Pixel C)";
        proxy_set_header Referer https://www.pixiv.net/;
        proxy_set_header Origin "";
        proxy_set_header Authorization $http_x_pixiv_authorization;
        proxy_set_header X-Pixiv-Authorization "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ---------------------------------------------------------------------
    # Pixiv OAuth (login / token refresh)
    # ---------------------------------------------------------------------
    location ^~ /pixiv-oauth/ {
        proxy_pass https://oauth.secure.pixiv.net/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name oauth.secure.pixiv.net;
        proxy_set_header Host oauth.secure.pixiv.net;
        proxy_set_header User-Agent "PixivAndroidApp/5.0.166 (Android 6.0; Pixel C)";
        proxy_set_header Referer https://www.pixiv.net/;
        proxy_set_header Origin "";
        proxy_set_header Authorization $http_x_pixiv_authorization;
        proxy_set_header X-Pixiv-Authorization "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ---------------------------------------------------------------------
    # Pixiv account pages / web pages
    # ---------------------------------------------------------------------
    location ^~ /pixiv-accounts/ {
        proxy_pass https://accounts.pixiv.net/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name accounts.pixiv.net;
        proxy_set_header Host accounts.pixiv.net;
        proxy_set_header Referer https://www.pixiv.net/;
        proxy_set_header Origin "";
        proxy_set_header Authorization $http_x_pixiv_authorization;
        proxy_set_header X-Pixiv-Authorization "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location ^~ /pixiv-web/ {
        proxy_pass https://www.pixiv.net/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name www.pixiv.net;
        proxy_set_header Host www.pixiv.net;
        proxy_set_header Origin "";
        proxy_set_header Authorization $http_x_pixiv_authorization;
        proxy_set_header X-Pixiv-Authorization "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ---------------------------------------------------------------------
    # Images (i.pximg.net / s.pximg.net)
    # ---------------------------------------------------------------------
    location ^~ /pximg/ {
        proxy_pass https://i.pximg.net/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name i.pximg.net;
        proxy_set_header Host i.pximg.net;
        proxy_set_header Referer https://www.pixiv.net/;
        proxy_set_header Origin "";
        proxy_set_header Authorization $http_x_pixiv_authorization;
        proxy_set_header X-Pixiv-Authorization "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_cache pixiv_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 206 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status;
        expires 7d;
    }

    location ^~ /spximg/ {
        proxy_pass https://s.pximg.net/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name s.pximg.net;
        proxy_set_header Host s.pximg.net;
        proxy_set_header Referer https://www.pixiv.net/;
        proxy_set_header Origin "";
        proxy_set_header Authorization $http_x_pixiv_authorization;
        proxy_set_header X-Pixiv-Authorization "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache pixiv_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 206 7d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status;
        expires 7d;
    }

    # ---------------------------------------------------------------------
    # pixivision (illustration magazine, used by the "soup" page)
    # ---------------------------------------------------------------------
    location ^~ /pixivision/ {
        proxy_pass https://www.pixivision.net/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name www.pixivision.net;
        proxy_set_header Host www.pixivision.net;
        proxy_set_header Referer https://www.pixivision.net/;
        proxy_set_header Origin "";
        proxy_set_header Authorization $http_x_pixiv_authorization;
        proxy_set_header X-Pixiv-Authorization "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ---------------------------------------------------------------------
    # SauceNAO (reverse image search, optional feature)
    # ---------------------------------------------------------------------
    location ^~ /saucenao/ {
        proxy_pass https://saucenao.com/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name saucenao.com;
        proxy_set_header Host saucenao.com;
        proxy_set_header Origin "";
        proxy_set_header Authorization $http_x_pixiv_authorization;
        proxy_set_header X-Pixiv-Authorization "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # ---------------------------------------------------------------------
    # SPA fallback
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
