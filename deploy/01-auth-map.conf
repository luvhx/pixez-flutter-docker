# The browser attaches its HTTP Basic credentials to every same-origin
# request, including the /pixiv-* proxies.  Pixiv expects its own OAuth
# `Authorization: Bearer ...` header, so a leaked `Basic ...` value makes the
# API answer 400.  Strip only the Basic header and keep the app's Bearer token.

map $http_authorization $pixez_upstream_authorization {
    default       $http_authorization;
    "~*^Basic\s"  "";
}
