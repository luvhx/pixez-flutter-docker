# Proxy cache zone for Pixiv images (http context, included from conf.d).
proxy_cache_path /var/cache/nginx/pixiv
    levels=1:2
    keys_zone=pixiv_cache:64m
    max_size=2g
    inactive=30d
    use_temp_path=off;

# Preserve the scheme reported by an upstream TLS terminator (Caddy/Traefik)
# so the session cookie can be marked Secure.
map $http_x_forwarded_proto $pixez_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
