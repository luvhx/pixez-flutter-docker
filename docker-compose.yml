name: pixez

services:
  pixez-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Flutter SDK version used to build the web bundle
        FLUTTER_VERSION: ${FLUTTER_VERSION:-3.47.7}
    image: pixez-web:${PIXEZ_TAG:-latest}
    container_name: ${PIXEZ_CONTAINER_NAME:-pixez-web}
    restart: unless-stopped
    ports:
      - "${PIXEZ_PORT:-7493}:80"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PIXEZ_AUTH_USER: ${PIXEZ_AUTH_USER:-pixez}
      PIXEZ_AUTH_PASSWORD: ${PIXEZ_AUTH_PASSWORD:?set PIXEZ_AUTH_PASSWORD in .env}
    volumes:
      # Persist the proxied image cache across restarts.
      - pixez-cache:/var/cache/nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pixez-cache:
