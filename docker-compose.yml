name: pixez

services:
  pixez-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Override to pin Flutter, e.g. FLUTTER_VERSION=3.47.7
        FLUTTER_VERSION: ${FLUTTER_VERSION:-stable}
    image: pixez-web:${PIXEZ_TAG:-latest}
    container_name: ${PIXEZ_CONTAINER_NAME:-pixez-web}
    restart: unless-stopped
    ports:
      - "${PIXEZ_PORT:-8080}:80"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # Persist the proxied image cache across restarts.
      - pixez-cache:/var/cache/nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pixez-cache:
