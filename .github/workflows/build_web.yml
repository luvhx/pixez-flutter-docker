name: Build Web Image

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter SDK version to build with'
        required: false
        default: 3.47.7
      push_image:
        description: 'Push the built image to GHCR'
        type: boolean
        default: true

concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # Image name follows the repository (pixez-flutter-docker).
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build Web Image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: 签出仓库
        uses: actions/checkout@v7

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune -af || true
          df -h /

      - name: 规范化镜像名
        id: image
        run: |
          echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: 初始化 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_image)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_image) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FLUTTER_VERSION=${{ inputs.flutter_version || '3.47.7' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出摘要
        run: |
          echo "### PixEz Web Image :whale:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "|Item|Value|" >> "$GITHUB_STEP_SUMMARY"
          echo "|:-|:-|" >> "$GITHUB_STEP_SUMMARY"
          echo "|Image|${{ steps.image.outputs.name }}|" >> "$GITHUB_STEP_SUMMARY"
          echo "|Digest|${{ steps.build.outputs.digest }}|" >> "$GITHUB_STEP_SUMMARY"
          echo "|Flutter|${{ inputs.flutter_version || '3.47.7' }}|" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
