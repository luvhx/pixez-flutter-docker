<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixEz · 登录</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f6f8; color: #111;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #101114; color: #eee; }
      .card { background: #181a1f; border-color: #2a2d34; }
      input { background: #101114; color: #eee; border-color: #333; }
      .muted { color: #999; }
    }
    .card {
      width: min(92vw, 440px); background: #fff; border: 1px solid #e3e5e9;
      border-radius: 16px; padding: 28px; box-shadow: 0 12px 40px rgba(0,0,0,.08);
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .muted { color: #666; font-size: 13px; margin: 0 0 20px; }
    label { display: block; font-size: 13px; margin: 14px 0 6px; }
    input {
      width: 100%; padding: 11px 12px; border: 1px solid #d5d8de; border-radius: 8px;
      font-size: 14px; background: #fff;
    }
    button {
      width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 8px;
      background: #3b82f6; color: #fff; font-size: 15px; cursor: pointer;
    }
    button.secondary { background: #e5e7eb; color: #111; margin-top: 10px; }
    .error {
      margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
      background: #fee2e2; color: #991b1b; white-space: pre-wrap;
    }
    .status { margin-top: 14px; font-size: 13px; }
    .status.ok { color: #15803d; }
    .status.warn { color: #b45309; }
    a { color: #2563eb; text-decoration: none; }
    .footer { margin-top: 18px; font-size: 12px; color: #777; line-height: 1.6; }
    code { font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>PixEz Web</h1>
    <p class="muted">首次使用需配置一个 Pixiv 账号，登录状态保存在服务端。</p>

    <div id="status" class="status"></div>
    <div id="error" class="error" hidden></div>

    <form id="login-form" method="post" action="/api/login">
      <label for="setup_token">管理口令（PIXEZ_SETUP_TOKEN）</label>
      <input id="setup_token" name="setup_token" type="password" autocomplete="off" required>

      <label for="refresh_token">Pixiv Refresh Token</label>
      <input id="refresh_token" name="refresh_token" type="password" autocomplete="off" required>

      <button type="submit">保存并登录</button>
    </form>

    <form id="logout-form" method="post" action="/api/logout" hidden>
      <button class="secondary" type="submit">退出登录</button>
    </form>

    <p class="footer">
      Refresh Token 可用 <code>node tool/get_token.js</code> 获取后粘贴到这里。<br>
      Pixiv 已关闭第三方密码登录，因此不再支持账号密码方式。
    </p>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const error = params.get('error');
    if (error) {
      const el = document.getElementById('error');
      el.hidden = false;
      el.textContent = error;
    }

    fetch('/api/session', { credentials: 'same-origin' })
      .then((r) => r.json())
      .then((s) => {
        const status = document.getElementById('status');
        const logout = document.getElementById('logout-form');
        if (s.authenticated && s.user) {
          status.className = 'status ok';
          status.textContent = `已登录：${s.user.name}（${s.user.account}）`;
          logout.hidden = false;
        } else if (s.configured) {
          status.className = 'status warn';
          status.textContent = '服务端已配置账号，请填写管理口令和 Refresh Token 重新登录。';
        } else {
          status.className = 'status warn';
          status.textContent = '服务端尚未配置 Pixiv 账号。';
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
